<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业运营 AI 工作台</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--muted:#86868b;
  --line:#e8e8ed;--blue:#0071e3;--green:#30d158;--orange:#ff9f0a;--red:#ff3b30;
  --purple:#8e8e93;--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.5;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* 三栏骨架 */
.app{display:grid;grid-template-columns:248px 1fr 320px;height:100vh;overflow:hidden}

/* 左侧菜单 */
.side{
  background:rgba(250,250,252,.85);backdrop-filter:saturate(180%) blur(20px);
  border-right:.5px solid var(--line);display:flex;flex-direction:column;
  padding:22px 14px 16px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand .logo{
  width:34px;height:34px;border-radius:10px;background:#1d1d1f;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:-1px;
}
.brand .bt{font-size:15px;font-weight:600;letter-spacing:-.3px}
.brand .bs{font-size:11px;color:var(--muted)}
.nav-label{font-size:11px;color:var(--muted);padding:14px 12px 6px;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
  padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--sub);
  font:inherit;font-size:13.5px;text-align:left;transition:background .2s,color .2s;
}
.nav button:hover{background:rgba(0,0,0,.04)}
.nav button.active{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav button .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--muted)}
.nav button.active .ic{color:var(--blue)}
.nav button .ic svg{width:18px;height:18px}
.side-foot{margin-top:auto;padding:16px 12px 0;font-size:11px;color:var(--muted);line-height:1.7}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}

/* 中间详情 */
.main{overflow-y:auto;padding:34px 40px 60px}
.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{margin-bottom:24px}
.phead .eyebrow{font-size:12px;color:var(--blue);font-weight:600;letter-spacing:.4px;margin-bottom:6px}
.phead h1{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.2}
.phead p{color:var(--sub);font-size:14px;margin-top:8px;max-width:680px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;color:var(--blue);
  font-size:11px;padding:3px 9px;border-radius:20px;margin-left:10px;vertical-align:middle;font-weight:500}

.card{background:var(--card);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.sec-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--sub)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.6px;margin:4px 0 2px}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi .v.blue{color:var(--blue)}.kpi .v.green{color:var(--green)}
.kpi .v.orange{color:var(--orange)}.kpi .v.red{color:var(--red)}
.kpi .v.purple{color:var(--sub)}
.expert-strip{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:18px;padding:12px 18px;box-shadow:var(--shadow);margin-bottom:18px;border-left:3px solid var(--blue)}
.ex-ic{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#f0f0f3;color:#6e6e73;display:inline-flex;align-items:center;justify-content:center}
.ex-ic svg{width:16px;height:16px;stroke-width:1.5}
.ex-ic.lg{width:40px;height:40px;flex:0 0 40px;border-radius:12px}
.ex-ic.lg svg{width:20px;height:20px}
.ex-tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ex-tx b{font-size:13px;color:var(--ink)}
.ex-tx span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.expert-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.ec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ec-name{font-size:15px;font-weight:600;color:var(--ink)}
.ec-role{font-size:12px;color:var(--muted);margin-top:2px}
.ec-duty{font-size:13px;line-height:1.7;color:var(--sub);margin:0 0 12px}
.ec-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ec-skills span{font-size:11px;color:var(--blue);background:rgba(0,113,227,.08);padding:4px 9px;border-radius:8px}
.ec-tools{font-size:12px;color:var(--muted)}
.ec-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ec-links .btn{font-size:12px;padding:6px 12px}
@media(max-width:760px){.expert-strip{flex-wrap:wrap}.ex-tx span{white-space:normal}.expert-strip .btn{margin-left:41px}}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.chartbox{min-width:0}
.chartbox .ct{font-size:13px;font-weight:600;margin-bottom:14px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}

/* 表格 */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:.5px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:.5px solid #f0f0f3;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.tag.high,.tag.red{background:#ffeceb;color:#d70015}
.tag.medium,.tag.orange{background:#fff3e0;color:#b25e00}
.tag.low,.tag.green{background:#e8f9ed;color:#1a7f37}
.tag.blue{background:#e8f2ff;color:#0066cc}
.tag.gray{background:#f0f0f3;color:#6e6e73}
.tag.purple{background:#f0f0f3;color:#6e6e73}

/* 功能按钮区 */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{border:0;background:#f0f0f3;color:var(--ink);padding:9px 16px;border-radius:11px;
  font:inherit;font-size:13px;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:#e6e6ea}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#0067d0}
.btn-s{padding:5px 11px;font-size:12px;border-radius:8px;background:#eef4ff;color:#0071e3}
.btn-s:hover{background:#dfeaff}
.actions.sub{margin-top:10px}
.actions.sub .hint{font-size:12px;margin-left:2px}
.saveState{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
td[data-bind="1"]{cursor:text}
td.editing{outline:2px solid #0071e3;outline-offset:-2px;background:#f5f9ff}
.tplbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tplbar .inp{font-size:13px;padding:8px 11px}
.varbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.varchip{border:0;background:#eef4ff;color:#0071e3;font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;transition:background .2s}
.varchip:hover{background:#dfeaff}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tpledit{width:100%;min-height:430px;box-sizing:border-box;font:inherit;font-size:13px;line-height:1.75;padding:16px 18px;border:.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);resize:vertical;white-space:pre-wrap}
.tpledit:focus{outline:2px solid #0071e3;outline-offset:-1px}
#tplPreview{white-space:pre-wrap;min-height:430px}
#ctPreview{white-space:pre-wrap;height:560px;overflow-y:auto}
#ctLease,#ctJoint{min-height:560px}
@media(max-width:900px){.tplgrid{grid-template-columns:1fr}.tpledit{min-height:300px}#tplPreview{min-height:auto}}
.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.inp{font:inherit;font-size:13px;padding:9px 12px;border:.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
select.inp{min-width:150px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--sub);line-height:1.75}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px}

/* 进度条 */
.bar{height:8px;background:#f0f0f3;border-radius:8px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--blue)}

/* 文档/方案预览 */
.doc{background:#fbfbfd;border-radius:14px;padding:20px 22px;font-size:13px;line-height:1.9;white-space:pre-wrap;color:#2c2c2e}

/* 右侧 AI 助理 */
.ai{
  background:rgba(250,250,252,.85);backdrop-filter:saturate(180%) blur(20px);
  border-left:.5px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
}
.ai-head{padding:20px 20px 14px;border-bottom:.5px solid var(--line)}
.ai-head .t{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.ai-head .t .spark{width:26px;height:26px;border-radius:8px;background:#1d1d1f;
  display:grid;place-items:center;color:#fff;font-size:14px}
.ai-head .d{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.ai-msg{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.65}
.msg.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.msg.bot .who{color:var(--sub)}
.ai-input{padding:12px 16px 16px;border-top:.5px solid var(--line)}
.ai-input .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-input .quick button{border:.5px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;
  font:inherit;font-size:11.5px;color:var(--sub);cursor:pointer}
.ai-input .quick button:hover{border-color:var(--blue);color:var(--blue)}
.ai-input .row{display:flex;gap:8px}
.ai-input textarea{flex:1;resize:none;height:44px;border:.5px solid var(--line);border-radius:12px;
  padding:11px 12px;font:inherit;font-size:13px;background:#fff;color:var(--ink);outline:none}
.ai-input textarea:focus{border-color:var(--blue)}
.ai-input .send{width:44px;border:0;background:var(--blue);color:#fff;border-radius:12px;cursor:pointer;font-size:17px}
.ai-note{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center}

/* 移动 */
.mtoggle{display:none}
.overlay{display:none}
.app.no-ai .ai{display:none!important}
.app.no-ai .mtoggle{display:none!important}
@media(min-width:1101px){.app.no-ai{grid-template-columns:248px 1fr}}
@media(max-width:1100px){
  .app{grid-template-columns:220px 1fr}
  .ai{display:none}
  .ai.open{display:flex;position:fixed;right:0;top:0;bottom:0;width:320px;z-index:60;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
  .mtoggle{display:grid;place-items:center;position:fixed;right:16px;bottom:16px;width:52px;height:52px;
    border:0;border-radius:50%;background:var(--blue);color:#fff;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.14);cursor:pointer;font-size:22px}
}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:70;transform:translateX(-100%);transition:transform .3s}
  .side.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:65}
  .menu-btn{display:grid!important}
  .main{padding:20px 16px 80px}
  .phead h1{font-size:24px}
  .card{padding:18px 16px;border-radius:16px}
}
.menu-btn{display:none;background:transparent;border:0;cursor:pointer;padding:4px;margin-right:8px;color:var(--ink)}
.menu-btn svg{width:22px;height:22px}
.phead .title-row{display:flex;align-items:center}

/* ===== 小珑ui：4px 网格与克制的视觉层 ===== */
.side{padding:24px 12px 16px}
.brand{padding:0 12px 24px}
.nav button{padding:8px 12px;border-radius:10px}
.nav-label{padding:16px 12px 8px}
.main{padding:32px 40px 64px}
.phead{margin-bottom:24px}
.phead h1{font-size:30px;font-weight:500;letter-spacing:-.6px}
.phead .eyebrow{font-size:12px;letter-spacing:.2px}
.card{padding:24px;border-radius:20px;margin-bottom:20px}
.kpi{padding:20px;border-radius:16px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.4px}
.sec-label{margin-bottom:16px}
.btn{padding:8px 16px;border-radius:10px}
.btn-s{padding:6px 12px;border-radius:8px}
.chartbox .ct{font-weight:500}
th{padding:10px 12px}
td{padding:12px}
.demo-foot{font-size:11px;color:var(--muted);text-align:center;padding:24px 0 8px}
.demo-tag{background:#f0f0f3;color:var(--muted);font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:0;font-weight:400}
.chart-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
.risk-txt{font-size:12px;color:var(--muted)}
.risk-h{color:#d70015}.risk-m{color:#b25e00}
.brand .logo{background:#1d1d1f;border-radius:10px;font-weight:600}
.ai-head .t .spark{background:#1d1d1f;border-radius:8px;font-size:13px}
.msg.bot .who{color:var(--muted)}
.aiview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.aiview iframe{width:100%;height:820px;border:0;display:block;background:#fff}
@media(max-width:760px){.main{padding:20px 16px 80px}.card{padding:20px 16px;border-radius:16px}.aiview iframe{height:720px}}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧菜单 -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">商</div>
      <div><div class="bt">商业运营工作台</div><div class="bs">AI Assistant Suite</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="dot"></span>演示数据 · 本地运行<br>所有数据仅在本机处理</div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- 中间详情 -->
  <main class="main" id="main"></main>

  <!-- 右侧 AI 助理 -->
  <aside class="ai" id="ai">
    <div class="ai-head">
      <div class="t"><span class="spark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span>运营助理</span></div>
      <div class="d">回答结合当前页面数据，在本地生成。</div>
    </div>
    <div class="ai-msg" id="aiMsg">
      <div class="msg bot"><div class="who">运营助理</div>左侧选一个工具，我可以解读当前页面的数据。也可以直接问下面的问题。</div>
    </div>
    <div class="ai-input">
      <div class="quick" id="quick">
        <button>哪个商户风险最高</button>
        <button>总结这页数据</button>
        <button>本月经营情况</button>
      </div>
      <div class="row">
        <textarea id="aiText" placeholder="问当前页的数据"></textarea>
        <button class="send" id="aiSend">↑</button>
      </div>
      <div class="ai-note">演示模式 · 基于当前页面的本地数据回答</div>
    </div>
  </aside>
  <button class="mtoggle" id="mtoggle">✦</button>
</div>
<script>
/* ===== 公共：SVG 图表 ===== */
const PAL=['#0071e3','#8e8e93','#c7c7cc','#ff9f0a','#ff3b30','#d1d1d6','#30d158','#aeaeb2'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'¥'+Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const pct=v=>((v||0)*100).toFixed(1)+'%';
function barChart(items,opt={}){
  items=items.filter(i=>i&&isFinite(i.value));
  if(!items.length)return '<div class="hint">暂无数据</div>';
  const W=520,labelW=opt.labelW||90,rowH=32,top=8,h=top+items.length*rowH+6;
  const max=Math.max(...items.map(i=>Math.abs(i.value)),1);
  let s='<svg viewBox="0 0 '+W+' '+h+'" role="img">';
  items.forEach((it,idx)=>{
    const y=top+idx*rowH,w=Math.max(2,(Math.abs(it.value)/max)*(W-labelW-72));
    const c=it.color||PAL[idx%PAL.length];
    s+='<text x="0" y="'+(y+15)+'" font-size="12" fill="#6e6e73">'+esc(String(it.label).slice(0,10))+'</text>';
    s+='<rect x="'+labelW+'" y="'+(y+4)+'" width="'+(W-labelW-72)+'" height="15" rx="7.5" fill="#f0f0f3"/>';
    s+='<rect x="'+labelW+'" y="'+(y+4)+'" width="'+w+'" height="15" rx="7.5" fill="'+c+'"/>';
    s+='<text x="'+(W-2)+'" y="'+(y+16)+'" font-size="12" text-anchor="end" fill="#1d1d1f" font-weight="500">'+esc(opt.format?opt.format(it.value):it.value)+'</text>';
  });
  return s+'</svg>';
}
function donutChart(items,opt={}){
  const total=items.reduce((a,b)=>a+Math.max(0,b.value),0);
  if(!total)return '<div class="hint">暂无数据</div>';
  const R=52,C=2*Math.PI*R;let acc=0;
  let s='<svg viewBox="0 0 360 150" role="img"><g transform="translate(72,75)">';
  s+='<circle r="'+R+'" fill="none" stroke="#f0f0f3" stroke-width="19"/>';
  items.forEach((it,i)=>{
    const val=Math.max(0,it.value),len=val/total*C;
    s+='<circle r="'+R+'" fill="none" stroke="'+(it.color||PAL[i%PAL.length])+'" stroke-width="19" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90)"/>';
    acc+=len;
  });
  s+='<text x="0" y="2" text-anchor="middle" font-size="20" font-weight="600" fill="#1d1d1f">'+esc(opt.format?opt.format(total):total)+'</text>';
  s+='<text x="0" y="18" text-anchor="middle" font-size="10" fill="#86868b">合计</text></g>';
  items.forEach((it,i)=>{const y=34+i*25;s+='<rect x="158" y="'+(y-8)+'" width="9" height="9" rx="2.5" fill="'+(it.color||PAL[i%PAL.length])+'"/><text x="175" y="'+y+'" font-size="12" fill="#1d1d1f">'+esc(it.label)+'</text><text x="352" y="'+y+'" font-size="12" text-anchor="end" fill="#6e6e73">'+esc(opt.format?opt.format(it.value):it.value)+'</text>';});
  return s+'</svg>';
}
function lineChart(points){
  if(!points.length)return '<div class="hint">暂无数据</div>';
  const W=520,H=160,L=44,B=26,T=14,R=12;
  const vals=points.map(p=>p.value),max=Math.max(...vals,1),min=0;
  const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1));
  const y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  [0,.5,1].forEach(f=>{const yy=T+f*(H-T-B);s+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#ededf0" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+4)+'" font-size="10" text-anchor="end" fill="#a1a1a6">'+Math.round(max*(1-f))+'</text>';});
  const d=points.map((p,i)=>(i?'L':'M')+x(i)+','+y(p.value)).join(' ');
  s+='<path d="'+d+'" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach((p,i)=>{s+='<circle cx="'+x(i)+'" cy="'+y(p.value)+'" r="3.5" fill="#fff" stroke="#0071e3" stroke-width="2"/><text x="'+x(i)+'" y="'+(H-5)+'" font-size="10" text-anchor="middle" fill="#86868b">'+esc(p.label)+'</text>';});
  return s+'</svg>';
}

function dl(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toastDemo('已下载 '+name);
}

const CONTRACT_VARS=['甲方','乙方','铺位','面积','用途','期限起','期限止','期限','免租期','金额','金额大写','保证金','支付周期','递增比例','分成比例','日期'];
const DIGIT_CN=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
function digitUppercase(n){
  n=Number(n)||0;
  if(!isFinite(n))return '';
  const cents=Math.round(n*100),int=Math.floor(cents/100),dec=cents%100;
  if(int===0&&dec===0)return '零元整';
  const units=['','万','亿','万亿'];
  const groups=[];let g=int;
  while(g>0){groups.unshift(g%10000);g=Math.floor(g/10000);}
  let out='';
  groups.forEach((grp,i)=>{
    const U=units[groups.length-1-i]||'';
    if(grp===0){if(out&&!out.endsWith('零'))out+='零';return;}
    let gs='',needZero=false;
    const d=[Math.floor(grp/1000),Math.floor(grp%1000/100),Math.floor(grp%100/10),grp%10];
    const u2=['仟','佰','拾',''];
    d.forEach((digit,j)=>{
      if(digit===0){if(gs)needZero=true;}
      else{if(needZero){gs+='零';needZero=false;}gs+=DIGIT_CN[digit]+u2[j];}
    });
    if(out&&int>=10000&&grp<1000&&!out.endsWith('零'))out+='零';
    out+=gs+U;
  });
  out=out.replace(/零+$/,'')+'元';
  if(dec===0)out+='整';
  else{
    const jiao=Math.floor(dec/10),fen=dec%10;
    if(jiao)out+=DIGIT_CN[jiao]+'角';else if(fen)out+='零';
    if(fen)out+=DIGIT_CN[fen]+'分';
  }
  return out;
}

function importCSV(id,input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const lines=String(r.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
    const rows=lines.map(l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const c=l[i];
        if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}
        else if(c===','&&!q){out.push(cur);cur='';}else cur+=c;}
      out.push(cur);return out.map(s=>s.trim());});
    const hd=rows.shift();
    if(!hd||!rows.length){toastDemo('CSV 没有可导入的数据行');input.value='';return;}
    const wrap=document.querySelector('#page-'+id+' .tablewrap');
    if(!wrap){toastDemo('本页没有可替换的明细表');input.value='';return;}
    wrap.innerHTML='<table><thead><tr>'+hd.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+hd.map((_,i)=>'<td>'+esc(row[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    wrap.dataset.custom='1';
    if(typeof saveTables==='function')saveTables();
    if(typeof makeEditable==='function')makeEditable();
    toastDemo('已导入 '+rows.length+' 行并保存到本浏览器，刷新不丢');
    input.value='';
  };
  r.readAsText(f,'UTF-8');
}

/* ===== 数据持久化：改动即存本浏览器，刷新不丢 ===== */
const STORE_KEY='xunke_wb_data_v1';
function readStore(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return {};}
}
function writeStore(s){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(s));return true;}
  catch(e){toastDemo('本地保存失败：'+e.message);return false;}
}
function saveTables(){
  const s=readStore();s.tables=s.tables||{};
  PAGES.forEach(p=>{
    const w=document.querySelector('#page-'+p.id+' .tablewrap');
    if(w&&w.dataset.custom==='1')s.tables[p.id]=w.innerHTML;
  });
  s.ts=Date.now();
  if(writeStore(s)){
    const stamp='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    document.querySelectorAll('.saveState').forEach(el=>el.textContent=stamp);
  }
}
function restoreTables(){
  const s=readStore();
  Object.entries(s.tables||{}).forEach(([id,html])=>{
    const w=document.querySelector('#page-'+id+' .tablewrap');
    if(w){w.innerHTML=html;w.dataset.custom='1';}
  });
  return Object.keys(s.tables||{}).length;
}
function makeEditable(){
  document.querySelectorAll('.tablewrap td').forEach(td=>{
    if(td.dataset.bind==='1')return;
    td.dataset.bind='1';td.title='双击编辑，改完自动保存';
    td.addEventListener('dblclick',()=>{
      if(td.isContentEditable)return;
      td.contentEditable='true';td.classList.add('editing');td.focus();
      const sel=window.getSelection(),range=document.createRange();
      range.selectNodeContents(td);sel.removeAllRanges();sel.addRange(range);
    });
    td.addEventListener('blur',()=>{
      if(!td.isContentEditable)return;
      td.contentEditable='false';td.classList.remove('editing');
      const w=td.closest('.tablewrap');
      if(w){w.dataset.custom='1';saveTables();}
    });
  });
}
function resetDemo(){
  if(!window.confirm('恢复演示数据？会清掉本浏览器里导入和编辑过的内容。'))return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
}

function exportBackup(){
  const payload={app:'商业运营AI工作台',version:1,exportedAt:new Date().toISOString(),data:readStore()};
  dl('工作台整包备份-'+new Date().toISOString().slice(0,10)+'.json',
     JSON.stringify(payload,null,2),'application/json;charset=utf-8');
  toastDemo('整包备份已下载，可存U盘或发同事');
}
function importBackup(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(String(r.result).replace(/^\ufeff/,''));
      if(!o||!o.data||typeof o.data!=='object')throw new Error('不是本工作台的备份文件');
      localStorage.setItem(STORE_KEY,JSON.stringify(o.data));
      toastDemo('备份已恢复，正在刷新…');
      setTimeout(()=>location.reload(),600);
    }catch(e){toastDemo('恢复失败：'+e.message);}
    input.value='';
  };
  r.readAsText(f,'UTF-8');
}

  }

  }

    if(d.topRisk)return '当前「'+name+'」风险最高的是：'+d.topRisk+'。建议优先处理，详情见页面清单。';
    return '这页主要看红/橙色的异常项。当前演示数据里标红的都需要关注，可以先从列表第一条查起。';
  }
  if(/总结|概览|多少|数据|情况/.test(q)){

  }

    return d.advice?d.advice:'建议先从异常项入手：把标红的数据逐笔核对来源，确认后再决定下一步。定期对同类数据做一次横向对比。';
  }
